  <style>
:root {
  --bg0: #f5f5f7;
  --bg1: #eef1f6;
  --surface: #ffffff;
  --surface2: #f2f2f7;
  --text: #1d1d1f;
  --text2: #6e6e73;
  --line: rgba(60, 60, 67, 0.12);
  --accent: #0071e3;
  --accent-soft: rgba(0, 113, 227, 0.12);
  --on-accent: #ffffff;
  --ok: #34c759;
  --warn: #ff3b30;
  --gold: #ff9f0A;
  --shadow: 0 8px 28px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
  --shadow-sm: 0 2px 10px rgba(0,0,0,0.05);
  --radius: 22px;
  --radius-sm: 16px;
  --bar-bg: rgba(245, 245, 247, 0.72);
  --bar-h: 56px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --app-l: max(16px, var(--safe-l));
  --app-r: max(16px, var(--safe-r));
  --app-b: max(12px, var(--safe-b));
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
[data-theme="dark"] {
  /* Valeo Santé dark palette — see report for sources */
  --bg0: #080a12;            /* --vs-ink / meta theme-color */
  --bg1: #0c0e18;            /* --vs-ink-2 */
  --surface: #191d29;        /* --vs-surface-2 */
  --surface2: #222735;       /* --vs-surface-3 */
  --text: #f8f6f2;           /* --vs-text */
  --text2: #9ca3b4;          /* --vs-text-dim */
  --line: #292e3d;           /* --vs-line */
  --accent: #36d3be;         /* --vs-aqua primary */
  --accent-2: #38cbdc;       /* --vs-cyan / breath start */
  --accent-soft: rgba(54, 211, 190, 0.18);
  --ok: #2fc699;             /* --vs-ok */
  --warn: #ea6753;           /* --vs-alert */
  --gold: #fab742;           /* --vs-warm-soft */
  --on-accent: #080a12;      /* ink on aqua: WCAG AA */
  --shadow: 0 8px 28px rgba(0,0,0,0.45);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.35);
  --bar-bg: rgba(8, 10, 18, 0.72);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; height: 100%; height: 100dvh;
  font-family: var(--font);
  color: var(--text);
  background: var(--bg0);
  overflow: hidden;
  overflow-x: hidden;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  letter-spacing: -0.01em;
}
button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
input { font: inherit; color: var(--text); }
.sky {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: linear-gradient(180deg, var(--bg0) 0%, var(--bg1) 100%);
}
[data-theme="dark"] .sky {
  background:
    radial-gradient(80% 50% at 85% -8%, rgba(56, 203, 220, 0.16) 0%, transparent 58%),
    radial-gradient(70% 45% at 8% 108%, rgba(54, 211, 190, 0.12) 0%, transparent 62%),
    linear-gradient(180deg, #080a12 0%, #0c0e18 55%, #0d1618 100%);
}
[data-theme="dark"] .tile,
[data-theme="dark"] .big-card,
[data-theme="dark"] .prog-card,
[data-theme="dark"] .preview-row span,
[data-theme="dark"] .modal,
[data-theme="dark"] .sheet {
  box-shadow: var(--shadow), inset 0 1px 0 rgba(54, 211, 190, 0.10);
}

#confetti { position: fixed; inset: 0; z-index: 80; pointer-events: none; }
#app {
  position: relative; z-index: 1;
  height: 100%; height: 100dvh;
  display: flex; flex-direction: column;
  max-width: 980px; margin: 0 auto;
  padding: 0 var(--app-r) var(--app-b) var(--app-l);
  overflow-x: hidden;
  min-width: 0;
  width: 100%;
}
.screen { flex: 1; display: flex; flex-direction: column; min-height: 0; animation: rise 0.45s var(--ease); }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(0.92); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
@keyframes bounce { 0% { transform: scale(1); } 35% { transform: scale(1.08); } 55% { transform: scale(0.97); } 100% { transform: scale(1); } }
@keyframes wiggle { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* Top bar */
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 6px;
  min-height: calc(var(--bar-h) + var(--safe-t));
  padding: calc(4px + var(--safe-t)) var(--app-r) 4px var(--app-l);
  margin: 0 calc(-1 * var(--app-r)) 0 calc(-1 * var(--app-l));
  background: transparent;
  border-bottom: 0.5px solid transparent;
  flex-wrap: nowrap;
  box-sizing: border-box;
}
.topbar::before {
  content: "";
  position: fixed;
  left: 0; right: 0; top: 0;
  height: calc(var(--safe-t) + var(--bar-h));
  width: auto;
  background: var(--bar-bg);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 0.5px solid var(--line);
  z-index: -1;
  pointer-events: none;
}
.topbar .spacer { flex: 1; min-width: 4px; }
.icon-btn {
  width: 44px; height: 44px; min-width: 44px; min-height: 44px; border-radius: 50%;
  background: var(--surface);
  box-shadow: var(--shadow-sm);
  font-size: 20px; display: grid; place-items: center;
  transition: transform 0.2s var(--ease);
  flex-shrink: 0;
}
.icon-btn:active { transform: scale(0.94); }
.star-chip, .profile-chip, .cloud-pill, .account-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--surface);
  border-radius: 999px;
  padding: 0 10px;
  min-height: 44px;
  font-size: 15px; font-weight: 600;
  box-shadow: var(--shadow-sm);
  max-width: 42vw;
  flex-shrink: 0;
}
.star-chip { min-width: 44px; padding: 0 8px; }
.profile-chip { min-width: 44px; padding: 0 8px; }
.profile-chip .av { font-size: 20px; }
.profile-chip .nm, .account-btn .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 18vw; }
.account-btn {
  padding: 0 12px 0 6px;
  color: var(--accent);
  gap: 8px;
  max-width: none;
}
.account-btn .av-circle {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center;
  font-size: 13px; font-weight: 700;
  flex-shrink: 0;
}
.account-btn.ghost .av-circle { background: var(--surface2); color: var(--text); font-size: 16px; }
.theme-toggle {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--surface);
  border-radius: 999px;
  padding: 0 6px 0 10px;
  height: 44px; min-height: 44px; min-width: 44px;
  box-shadow: var(--shadow-sm);
  flex-shrink: 0;
  transition: transform 0.2s var(--ease);
}
.theme-toggle:active { transform: scale(0.96); }
.theme-toggle .theme-ico { font-size: 16px; line-height: 1; width: 18px; text-align: center; }
.theme-toggle .ios-switch { width: 44px; height: 44px; }
.theme-toggle .ios-switch::before { height: 26px; }
.theme-toggle .ios-switch i { width: 22px; height: 22px; margin-top: -11px; left: 2px; }
.theme-toggle .ios-switch.on i { transform: translateX(18px); }
.more-wrap { position: relative; flex-shrink: 0; }
.more-menu {
  position: absolute; top: calc(100% + 8px); right: 0; z-index: 35;
  background: var(--surface); border-radius: 16px; box-shadow: var(--shadow);
  padding: 6px; min-width: 200px; max-width: min(280px, calc(100vw - 24px - var(--safe-l) - var(--safe-r)));
  max-height: min(70dvh, calc(100dvh - var(--bar-h) - 16px)); overflow: auto;
  border: 0.5px solid var(--line); animation: pop 0.25s var(--ease);
}
.more-menu button {
  display: flex; align-items: center; gap: 10px; width: 100%;
  min-height: 44px; padding: 8px 12px; border-radius: 12px;
  font-weight: 600; font-size: 16px; text-align: left;
}
.more-menu button:active { background: var(--surface2); }
@media (min-width: 481px) {
  .more-btn, .more-menu { display: none !important; }
}
@media (max-width: 480px) {
  .topbar .bar-extra { display: none !important; }
}
@media (max-width: 700px) {
  .topbar:has(.profile-chip) .profile-chip .nm,
  .topbar:has(.profile-chip) .account-btn .nm,
  .topbar:has(.bar-extra) .account-btn .nm,
  .topbar:has(.more-btn) .account-btn .nm { display: none; }
  .topbar:has(.profile-chip) .account-btn,
  .topbar:has(.bar-extra) .account-btn,
  .topbar:has(.more-btn) .account-btn { padding: 0; width: 44px; justify-content: center; gap: 0; }
}
@media (max-width: 560px) {
  .theme-toggle { width: 44px; height: 44px; padding: 0; }
  .theme-toggle .ios-switch { display: none; }
  .theme-toggle .theme-ico { font-size: 18px; width: auto; }
}
@media (min-width: 600px) {
  :root {
    --app-l: max(20px, var(--safe-l));
    --app-r: max(20px, var(--safe-r));
    --app-b: max(16px, var(--safe-b));
  }
}

/* Typography */
.title { text-align: center; margin: 8px 0 16px; }
.title h1 { font-size: clamp(32px, 6vw, 48px); margin: 0; font-weight: 700; letter-spacing: -0.03em; }
.title p { margin: 6px 0 0; font-size: 17px; color: var(--text2); font-weight: 500; }
.hint { text-align: center; font-weight: 600; color: var(--text2); margin: 0 0 14px; font-size: 15px; }
.lbl { font-size: 13px; font-weight: 600; color: var(--text); text-align: center; line-height: 1.2; }
.lbl .en { display: block; font-size: 12px; font-weight: 500; color: var(--text2); margin-top: 2px; }

/* Start */
.mascot, .titou-hero { width: min(42vw, 168px); height: auto; margin: 6vh auto 10px; display: block; }
.brand-logo {
  width: 44px; height: 44px; min-width: 44px; padding: 2px; flex: 0 0 auto;
  display: grid; place-items: center; border-radius: 12px;
}
.brand-logo .titou { width: 36px; height: 36px; margin: 0; animation: none; }
.titou-shadow { fill: currentColor; opacity: 0.14; }
.titou-fur { fill: #F4A56C; }
.titou-stroke { stroke: #E08A4F; }
.titou-inner { fill: #36d3be; }
.titou-belly { fill: #FFE9D2; }
.titou-tuft { fill: #E08A4F; }
.titou-foot { fill: #E08A4F; }
.titou-blush { fill: #FF8A7A; opacity: 0.45; }
[data-theme="dark"] .titou-fur { fill: #F6B27E; }
[data-theme="dark"] .titou-stroke { stroke: #E8A56A; }
[data-theme="dark"] .titou-tuft, [data-theme="dark"] .titou-foot { fill: #E8A56A; }
.titou-eyes-happy, .titou-eyes-try, .titou-mouth-happy, .titou-mouth-try, .titou-medal { display: none; }
.titou--happy .titou-eyes-idle, .titou--happy .titou-mouth-idle { display: none; }
.titou--happy .titou-eyes-happy, .titou--happy .titou-mouth-happy { display: inline; }
.titou--try .titou-eyes-idle, .titou--try .titou-mouth-idle { display: none; }
.titou--try .titou-eyes-try, .titou--try .titou-mouth-try { display: inline; }
.titou--medal .titou-medal { display: inline; }
@keyframes titou-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
@keyframes titou-wave { 0%,100% { transform: rotate(0deg); } 25% { transform: rotate(32deg); } 50% { transform: rotate(-10deg); } 75% { transform: rotate(24deg); } }
@keyframes titou-jump { 0%,100% { transform: translateY(0); } 35% { transform: translateY(-16px); } 60% { transform: translateY(-6px); } }
@keyframes titou-nudge { 0%,100% { transform: rotate(0); } 35% { transform: rotate(-8deg); } 70% { transform: rotate(5deg); } }
.titou--idle, .titou--wave { animation: titou-bob 3.6s ease-in-out infinite; }
.titou--wave .titou-arm-r { transform-origin: 154px 140px; animation: titou-wave 1.15s ease-in-out infinite; }
.titou--happy { animation: titou-jump 0.7s var(--ease); }
.titou--try { animation: titou-nudge 0.85s ease-in-out; transform-origin: 50% 80%; }
.titou--medal { animation: wiggle 1s ease-in-out infinite; }
.titou-react {
  position: absolute; right: var(--app-r); top: calc(var(--bar-h) + var(--safe-t) + 4px);
  width: 72px; height: auto; z-index: 8; pointer-events: none; margin: 0;
}
.titou-celebrate { width: min(42vw, 140px); height: auto; margin: 0 auto 8px; display: block; }
.titou-empty { width: 96px; height: auto; margin: 8px auto 10px; display: block; }
.titou-medal-lg { width: 88px; height: auto; margin: 0 auto 6px; display: block; }
.plan-badge {
  display: inline-block; font-size: 12px; font-weight: 700; padding: 4px 9px;
  border-radius: 99px; background: var(--surface2); color: var(--text2); margin-top: 6px;
}
.plan-badge.monthly { background: var(--accent); color: var(--on-accent); }
.plan-badge.lifetime, .plan-badge.lifetime_free { background: var(--accent-soft); color: var(--text); }
.plan-card {
  background: var(--surface2); border-radius: 20px; padding: 16px 16px 14px;
  margin-bottom: 12px; border: 0.5px solid var(--line); text-align: left;
}
.plan-card h3 { margin: 0 0 4px; font-size: 18px; }
.plan-card .price { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; }
.plan-card .period { font-size: 15px; color: var(--text2); font-weight: 600; }
.plan-card p { margin: 8px 0 12px; }
.sheet.wide { max-width: min(920px, 100%); }
.admin-stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
.admin-stat { background: var(--surface2); border-radius: 14px; padding: 10px 12px; min-width: 88px; flex: 1 1 88px; text-align: left; }
.admin-stat .n { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; }
.admin-stat .l { font-size: 12px; color: var(--text2); font-weight: 600; }
.admin-gift { background: var(--surface2); border-radius: 16px; padding: 12px; margin-bottom: 12px; text-align: left; }
.admin-gift h3 { margin: 0 0 8px; font-size: 16px; }
.admin-gift .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-start; }
.admin-gift .row input { flex: 1 1 180px; margin-bottom: 0; }
.admin-table-wrap { overflow: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px 8px; }
.admin-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 680px; }
.admin-table th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text2); padding: 8px; font-weight: 700; }
.admin-table td { padding: 8px; border-top: 0.5px solid var(--line); vertical-align: middle; }
.admin-table select {
  font: inherit; font-weight: 600; border-radius: 10px; padding: 8px 6px; min-height: 44px;
  background: var(--bg0); color: var(--text); border: 0.5px solid var(--line); max-width: 160px;
}
.admin-cards { display: none; }
.admin-card { background: var(--surface2); border-radius: 16px; padding: 12px; text-align: left; }
.admin-card .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
.admin-card .meta { font-size: 13px; color: var(--text2); font-weight: 600; margin: 0 0 8px; }
@media (max-width: 640px) {
  .admin-table-wrap { display: none; }
  .admin-cards { display: flex; flex-direction: column; gap: 10px; }
}
@media (min-width: 720px) {
  .overlay:has(.sheet.wide) { align-items: center; padding: max(20px, var(--safe-t)) max(20px, var(--safe-r)) max(20px, var(--safe-b)) max(20px, var(--safe-l)); }
  .sheet.wide { border-radius: 28px; }
}
@media (prefers-reduced-motion: reduce) {
  .titou--idle, .titou--wave, .titou--happy, .titou--try, .titou--medal, .titou--wave .titou-arm-r { animation: none; }
}
.play-btn {
  width: 88px; height: 88px; margin: 22px auto 0; border-radius: 50%;
  background: var(--accent); color: var(--on-accent); font-size: 32px;
  display: grid; place-items: center; padding-left: 4px;
  box-shadow: 0 10px 28px rgba(0, 113, 227, 0.35);
  animation: pulse 2s ease-in-out infinite;
}
[data-theme="dark"] .play-btn { box-shadow: 0 10px 28px rgba(54, 211, 190, 0.35); }
.play-btn:active { transform: scale(0.96); animation: none; }
.preview-row { display: flex; justify-content: center; gap: 10px; margin-top: 36px; flex-wrap: wrap; }
.preview-row span {
  background: var(--surface); width: 52px; height: 52px; border-radius: 16px;
  display: grid; place-items: center; font-size: 26px; box-shadow: var(--shadow-sm);
}

/* Grids & tiles */
.scroll { overflow: auto; padding: 4px 2px 24px; -webkit-overflow-scrolling: touch; flex: 1; }
.grid { display: grid; gap: 14px; }
.grid.cats { grid-template-columns: repeat(2, 1fr); }
.grid.themes { grid-template-columns: repeat(2, 1fr); }
.grid.avatars { grid-template-columns: repeat(4, 1fr); gap: 10px; }
.grid.profiles { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.grid.modes { grid-template-columns: 1fr; max-width: 440px; margin: 0 auto; width: 100%; }
.grid.choices-2, .grid.choices-3, .grid.choices-4, .grid.choices-6 {
  flex: 1; min-height: 0; min-width: 0;
  align-content: stretch; align-items: stretch;
}
.grid.choices-2 { grid-template-columns: repeat(2, 1fr); grid-template-rows: 1fr; }
.grid.choices-3 { grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr; }
.grid.choices-4 { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); }
.grid.choices-6 { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); }
.tile {
  background: var(--surface); border-radius: var(--radius);
  box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; padding: 18px 10px 16px; min-height: 132px;
  transition: transform 0.2s var(--ease);
  position: relative; border: 0.5px solid var(--line);
}
.tile:active { transform: scale(0.97); }
.tile .em { font-size: clamp(36px, 10vw, 52px); line-height: 1; }
.tile.add { background: transparent; border: 1.5px dashed var(--line); box-shadow: none; }
.tile.theme .badge { position: absolute; top: 10px; right: 10px; font-size: 18px; }
.cat-tile { min-height: 148px; }
.cat-tile .em-wrap {
  width: 56px; height: 56px; border-radius: 18px;
  display: grid; place-items: center; font-size: 30px;
  background: var(--surface2);
}
.mode-btn { flex-direction: row; justify-content: flex-start; gap: 16px; padding: 16px 18px; min-height: 88px; text-align: left; }
.mode-btn .em { font-size: 36px; }
.mode-btn .txt b { display: block; font-size: 18px; font-weight: 650; }
.mode-btn .txt span { font-size: 13px; color: var(--text2); font-weight: 500; }
.mode-btn.featured { box-shadow: 0 0 0 2px var(--accent), var(--shadow); }

/* Choices / discover */
.choice {
  min-height: 0; min-width: 0; height: 100%;
  border-radius: 20px; background: var(--surface);
  box-shadow: var(--shadow); display: grid; place-items: center; padding: 8px;
  border: 0.5px solid var(--line); transition: transform 0.2s var(--ease);
}
.choice .em { font-size: clamp(44px, 11vw, 96px); line-height: 1; }
.choice .multi { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; }
.choice .multi .em { font-size: clamp(22px, 6vw, 40px); }
.choice.correct { box-shadow: 0 0 0 4px var(--ok); animation: bounce 0.5s var(--ease); }
.choice.wrong { box-shadow: 0 0 0 4px var(--warn); animation: shake 0.4s ease; opacity: 0.55; }
.discover-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; min-height: 0; }
.big-card {
  width: min(84vw, 400px); aspect-ratio: 1; max-height: min(52dvh, 400px); max-width: 100%;
  background: var(--surface); border-radius: 32px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; padding: 20px; animation: pop 0.4s var(--ease); border: 0.5px solid var(--line);
}
.big-card .em { font-size: clamp(80px, 24vw, 160px); line-height: 1; }
.big-card .word { font-size: clamp(24px, 6vw, 36px); font-weight: 700; letter-spacing: -0.02em; }
.big-card .word-fr { font-size: 15px; color: var(--text2); font-weight: 500; }
.nav-row { display: flex; align-items: center; justify-content: center; gap: 16px; }
.listen-btn {
  width: 72px; height: 72px; border-radius: 50%; background: var(--accent); color: var(--on-accent);
  font-size: 28px; display: grid; place-items: center; box-shadow: 0 8px 20px rgba(0,113,227,0.28);
}
[data-theme="dark"] .listen-btn { box-shadow: 0 8px 20px rgba(54, 211, 190, 0.30); }
.listen-btn:active { transform: scale(0.96); }
.dots { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); transform: scale(1.3); }
.dots i.done { background: var(--ok); }
.quiz-head { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 8px 0 12px; }
.speaker-hero {
  width: 84px; height: 84px; border-radius: 50%; background: var(--surface);
  font-size: 36px; box-shadow: var(--shadow); display: grid; place-items: center;
  animation: pulse 2s ease-in-out infinite;
}
.round-chip { background: var(--surface2); border-radius: 999px; padding: 5px 12px; font-weight: 600; font-size: 13px; color: var(--text2); }

/* Memory */
.mem-wrap {
  flex: 1; min-height: 0; min-width: 0; width: 100%;
  display: grid; place-items: center;
  padding: 8px 0 8px;
  container-type: size;
}
.mem-grid { display: grid; gap: 8px; }
.mem-grid.p8 {
  grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr);
  width: min(100cqw, calc(100cqh * 2));
  height: min(100cqh, calc(100cqw / 2));
}
.mem-grid.p12 {
  grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr);
  width: min(100cqw, calc(100cqh * 4 / 3));
  height: min(100cqh, calc(100cqw * 3 / 4));
}
.mem-grid.p16 {
  grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr);
  width: min(100cqw, 100cqh);
  height: min(100cqw, 100cqh);
}
.mcard { aspect-ratio: auto; width: 100%; height: 100%; min-width: 0; min-height: 0; border-radius: 16px; perspective: 480px; background: transparent; position: relative; }
.mcard .face { position: absolute; inset: 0; border-radius: 16px; display: grid; place-items: center;
  backface-visibility: hidden; -webkit-backface-visibility: hidden; transition: transform 0.4s var(--ease); box-shadow: var(--shadow-sm); }
.mcard .back { background: var(--accent); color: var(--on-accent); font-size: 22px; transform: rotateY(0); }
.mcard .front { background: var(--surface); font-size: clamp(26px, 7vw, 48px); transform: rotateY(180deg); }
.mcard.flipped .back, .mcard.matched .back { transform: rotateY(180deg); }
.mcard.flipped .front, .mcard.matched .front { transform: rotateY(0); }
.mcard.matched .front { box-shadow: 0 0 0 3px var(--ok); }

/* Age picker */
.age-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 8px 0 18px; }
.age-btn {
  background: var(--surface); border-radius: 20px; padding: 14px 4px 10px;
  box-shadow: var(--shadow-sm); border: 2px solid transparent;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  transition: transform 0.2s var(--ease), border-color 0.2s var(--ease);
  min-height: 96px;
}
.age-btn .n { font-size: 28px; font-weight: 700; letter-spacing: -0.04em; }
.age-btn .v { font-size: 22px; line-height: 1; }
.age-btn .s { font-size: 12px; color: var(--text2); font-weight: 600; }
.age-btn.on { border-color: var(--accent); background: var(--accent-soft); }

/* Forms & sheets */
.overlay {
  position: fixed; inset: 0; z-index: 40;
  background: rgba(0,0,0,0.36);
  display: flex; align-items: flex-end; justify-content: center;
  padding: 0; animation: fade 0.25s ease;
}
.overlay.center { align-items: center; padding: 20px; }
.sheet, .modal {
  background: var(--surface); color: var(--text);
  border-radius: 28px 28px 0 0;
  padding: 12px max(16px, var(--safe-r), 22px) max(22px, var(--safe-b)) max(16px, var(--safe-l), 22px);
  width: 100%; max-width: 560px;
  box-shadow: var(--shadow);
  animation: rise 0.4s var(--ease);
  max-height: min(92dvh, calc(100dvh - var(--safe-t) - 8px));
  overflow: auto;
  -webkit-overflow-scrolling: touch;
  box-sizing: border-box;
}
.overlay.center .modal, .overlay.center .sheet { border-radius: 28px; animation: pop 0.35s var(--ease); width: min(520px, calc(100vw - 16px - var(--safe-l) - var(--safe-r))); max-width: 100%; padding: 24px 22px 20px; }
.sheet .handle { width: 36px; height: 5px; border-radius: 99px; background: var(--line); margin: 4px auto 14px; }
.modal h2, .sheet h2 { margin: 0 0 8px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.modal p, .sheet p { margin: 0 0 14px; color: var(--text2); font-weight: 500; font-size: 15px; }
.modal input[type="text"], .modal input[type="email"], .modal input[type="password"],
.sheet input[type="text"], .sheet input[type="email"], .sheet input[type="password"] {
  width: 100%; font-size: 17px; padding: 14px 16px; border-radius: 14px;
  border: 1px solid var(--line); outline: none; background: var(--surface2);
  text-align: left; margin: 0 0 10px;
}
.modal input:focus, .sheet input:focus { border-color: var(--accent); }
.row-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.pill {
  min-width: 110px; min-height: 48px; padding: 10px 18px; border-radius: 14px;
  font-size: 16px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--surface2);
  transition: transform 0.15s var(--ease);
}
.pill:active { transform: scale(0.97); }
.pill.ok { background: var(--accent); color: var(--on-accent); }
.pill.no { background: var(--surface2); color: var(--text); }
.pill.warn { background: var(--warn); color: #fff; }
[data-theme="dark"] .pill.warn { color: #080a12; }
.pill.gold { background: var(--surface2); color: var(--text); }
.math-btns { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.math-btns .pill { min-height: 64px; font-size: 26px; font-weight: 700; }
.tiny { font-size: 13px; font-weight: 500; color: var(--text2); line-height: 1.45; text-align: left; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0; border-bottom: 0.5px solid var(--line); font-weight: 600; }
.ios-switch { width: 51px; height: 44px; border-radius: 16px; background: transparent; position: relative; flex-shrink: 0; }
.ios-switch::before {
  content: ""; position: absolute; left: 0; right: 0; height: 31px; top: 50%;
  transform: translateY(-50%); border-radius: 16px; background: #e9e9ea;
  transition: background 0.25s var(--ease);
}
[data-theme="dark"] .ios-switch::before { background: #39393d; }
.ios-switch.on::before { background: #34c759; }
[data-theme="dark"] .ios-switch.on::before { background: #36d3be; }
.ios-switch i { position: absolute; top: 50%; left: 2px; width: 27px; height: 27px; margin-top: -13.5px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.2); transition: transform 0.25s var(--ease); z-index: 1; }
.ios-switch.on i { transform: translateX(20px); }

.auth-msg { font-weight: 600; font-size: 14px; margin: 0 0 10px; line-height: 1.35; }
.auth-msg.err { color: var(--warn); }
.auth-msg.ok { color: var(--ok); }
.menu-list { display: flex; flex-direction: column; gap: 2px; }
.menu-list button { text-align: left; padding: 14px 8px; border-radius: 12px; font-weight: 600; font-size: 16px; }
.menu-list button:active { background: var(--surface2); }
.parent-list .item { display: flex; align-items: center; gap: 10px; background: var(--surface2); border-radius: 16px; padding: 10px; margin-bottom: 8px; }
.parent-list .item .av { font-size: 32px; }
.parent-list .grow { flex: 1; font-weight: 650; }
.progress-list { display: flex; flex-direction: column; gap: 12px; overflow: auto; padding-bottom: 16px; }
.prog-card { background: var(--surface); border-radius: 20px; padding: 14px 16px; box-shadow: var(--shadow-sm); border: 0.5px solid var(--line); }
.prog-card .head { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; }
.prog-card .head .right { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 15px; color: var(--text2); }
.word-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.word-row .w { width: 40px; height: 40px; border-radius: 12px; background: var(--surface2); display: grid; place-items: center; font-size: 22px; }
.word-row .w.on { background: var(--accent-soft); box-shadow: 0 0 0 1.5px var(--accent); }
.word-row .w.off { filter: grayscale(1); opacity: 0.4; }
.level-medal { font-size: 36px; }
.level-medal.ready { animation: wiggle 0.9s ease-in-out infinite; }
.celebrate { font-size: 64px; margin: 0 0 8px; animation: bounce 0.8s var(--ease); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
.account-menu { position: fixed; top: calc(var(--safe-t) + var(--bar-h) + 4px); right: var(--app-r); z-index: 36;
  background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 8px;
  min-width: min(240px, calc(100vw - 16px - var(--safe-l) - var(--safe-r)));
  max-width: calc(100vw - 16px - var(--safe-l) - var(--safe-r));
  max-height: min(70dvh, calc(100dvh - var(--bar-h) - var(--safe-t) - 16px));
  overflow: auto;
  border: 0.5px solid var(--line); animation: pop 0.25s var(--ease); }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #adb5bd; display: inline-block; }
.sync-dot.on { background: var(--ok); }
.sync-dot.wait { background: var(--gold); }
.sync-dot.off { background: var(--warn); }

@media (min-width: 720px) {
  .grid.cats { grid-template-columns: repeat(4, 1fr); }
  .grid.themes { grid-template-columns: repeat(3, 1fr); }
  .grid.choices-4 { grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr; }
  .overlay { align-items: center; padding: max(20px, var(--safe-t)) max(20px, var(--safe-r)) max(20px, var(--safe-b)) max(20px, var(--safe-l)); }
  .sheet { border-radius: 28px; }
  .sheet .handle { display: none; }
}
@media (max-width: 420px) {
  .age-row { gap: 6px; }
  .age-btn { min-height: 88px; padding: 10px 2px; }
  .age-btn .n { font-size: 24px; }
  .grid.choices-3 { gap: 8px; }
  .star-chip, .profile-chip { padding: 0 8px; }
  .grid.cats, .grid.themes { gap: 10px; }
  .tile { padding: 14px 8px 12px; min-height: 120px; }
  .cat-tile { min-height: 132px; }
}
@media (max-height: 500px) {
  .quiz-head { flex-direction: row; margin: 2px 0 6px; gap: 8px; }
  .speaker-hero { width: 48px; height: 48px; min-width: 48px; font-size: 22px; animation: none; }
  .round-chip { padding: 4px 10px; }
  .choice .em { font-size: clamp(28px, 12vh, 64px); }
  .mascot, .titou-hero { margin: 8px auto 4px; width: min(20vw, 88px); }
  .play-btn { margin-top: 10px; width: 72px; height: 72px; }
  .preview-row { margin-top: 12px; }
  .title { margin: 4px 0 8px; }
  .title h1 { font-size: clamp(22px, 6vh, 36px); }
  .title p { font-size: 14px; }
  .big-card { max-height: calc(100dvh - var(--bar-h) - var(--safe-t) - 100px); width: min(50vw, 280px); }
  .listen-btn { width: 52px; height: 52px; font-size: 22px; }
  .discover-wrap { gap: 8px; }
  .nav-row { gap: 12px; }
  .grid.modes { max-width: none; grid-template-columns: repeat(3, 1fr); }
  .mode-btn { flex-direction: column; min-height: 88px; padding: 10px 8px; text-align: center; gap: 6px; }
}
@media (max-height: 500px) and (min-width: 700px) {
  .grid.choices-6 { grid-template-columns: repeat(6, 1fr); grid-template-rows: 1fr; }
  .grid.choices-3 { grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr; }
  .grid.choices-2 { grid-template-columns: repeat(2, 1fr); grid-template-rows: 1fr; }
}
/* Listen-again control — big, obvious, labelled */
.listen-again {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px; background: none; border: none; flex-shrink: 0;
}
.listen-again .listen-lbl {
  font-size: 15px; font-weight: 700; color: var(--text); letter-spacing: -0.01em;
}
.speaker-hero { width: 92px; height: 92px; min-width: 92px; min-height: 92px; }
.quiz-head { margin: 4px 0 14px; gap: 10px; }
.grid[class*="choices"] { margin-top: 4px; }
.nav-row { gap: 20px; }
.nav-row .listen-again .listen-btn { width: 80px; height: 80px; font-size: 32px; }
.mem-head { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 0 0 6px; flex-shrink: 0; }

/* Hover (mouse / trackpad only) — Apple / Valeo Santé lift */
@media (hover: hover) and (pointer: fine) {
  .tile, .choice, .pill, .play-btn, .listen-btn, .icon-btn,
  .account-btn, .theme-toggle, .age-btn, .profile-chip, .brand-logo,
  .speaker-hero, .big-card, .mode-btn, .listen-again, .more-btn {
    transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
  }
  .tile:hover, .choice:hover, .age-btn:hover, .big-card:hover, .mode-btn:hover, .pill:hover {
    transform: translateY(-3px) scale(1.015);
    box-shadow: 0 14px 32px rgba(0, 0, 0, 0.12), 0 2px 8px rgba(0, 0, 0, 0.05);
  }
  [data-theme="dark"] .tile:hover,
  [data-theme="dark"] .choice:hover,
  [data-theme="dark"] .age-btn:hover,
  [data-theme="dark"] .big-card:hover,
  [data-theme="dark"] .mode-btn:hover,
  [data-theme="dark"] .pill:hover {
    box-shadow: 0 14px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(54, 211, 190, 0.16);
  }
  .play-btn:hover, .listen-btn:hover, .speaker-hero:hover, .icon-btn:hover,
  .account-btn:hover, .theme-toggle:hover, .profile-chip:hover, .listen-again:hover, .brand-logo:hover {
    transform: translateY(-2px) scale(1.02);
  }
  .mcard:hover { filter: brightness(1.06); }
}
.tile:active, .choice:active, .age-btn:active, .big-card:active, .mode-btn:active,
.pill:active, .play-btn:active, .listen-btn:active, .icon-btn:active,
.account-btn:active, .theme-toggle:active, .profile-chip:active, .speaker-hero:active, .brand-logo:active {
  transform: scale(0.97);
}

@media (max-height: 500px) {
  .speaker-hero { width: 56px; height: 56px; min-width: 56px; min-height: 56px; font-size: 24px; }
  .listen-again .listen-lbl { font-size: 13px; }
  .nav-row .listen-again .listen-btn { width: 56px; height: 56px; font-size: 22px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  .tile:hover, .choice:hover, .age-btn:hover, .big-card:hover, .mode-btn:hover, .pill:hover,
  .play-btn:hover, .listen-btn:hover, .speaker-hero:hover, .icon-btn:hover,
  .account-btn:hover, .theme-toggle:hover, .profile-chip:hover, .listen-again:hover, .brand-logo:hover {
    transform: none; filter: none;
  }
}


/* Site header & footer (parent-facing chrome; not used in-game) */
html[data-chrome="site"], html[data-chrome="site"] body {
  overflow: auto;
  overflow-x: hidden;
  height: auto;
  min-height: 100dvh;
  user-select: auto;

}

  font-size: 17px; font-weight: 700; letter-spacing: -0.03em; white-space: nowrap;
}

  padding: 28px var(--app-r) calc(20px + var(--safe-b)) var(--app-l);

}

}

  function setRoute(path, replace) {
    const next = path ? "#/" + path : (location.pathname + location.search);
    const cur = location.hash || "";
    const want = path ? "#/" + path : "";
    if (!path && (cur === "" || cur === "#" || cur === "#/")) return;
    if (path && cur === want) return;
    const url = path ? (location.pathname + location.search + want) : (location.pathname + location.search);
    if (replace || !path) history.replaceState(null, "", url);
    else history.pushState(null, "", url);

    else if (screen === "themes") html = renderThemes();
    else if (screen === "modes") html = renderModes();
    else if (screen === "discover") html = renderDiscover();
    else if (screen === "quiz") html = renderQuiz();
    else if (screen === "memory") html = renderMemory();
    else if (screen === "progress") html = renderProgress();

    else if (screen === "legal") html = renderLegalPage();
    else if (screen === "blog") html = renderBlogPage();
    else if (screen === "aide") html = renderAidePage();

  function onAct(act, id, el) {
    if (Date.now() - lastTap < 180 && act === "answer") return;
    lastTap = Date.now();
    if (act !== "close-overlay") sfx("tap");
    unlockAudio();
    if (act !== "bar-more" && barMore) barMore = false;

    if (act === "play") {
      skipAnnounce = true;
      speak("Hello!", "en-US").then(function () {
        return speak("Hi! I'm Titou! Let's play!", "en-US");
      }).then(function () {
        if (store.frenchPrompts) speak("C'est qui ?", "fr-FR");
      });
      go("profiles"); return;
    }
    if (act === "titou-hello") {
      speak("Hello!", "en-US").then(function () {
        return speak("Hi! I'm Titou! Let's play!", "en-US");
      });
      return;
    }
    if (act === "open-plans") {
      accountMenu = false; siteNavOpen = false; plansMsg = "";
      if (isKidScreen()) { overlay = { type: "plans" }; render(); }
      else goSite("plans", { hash: "abonnements" });

    }
    if (act === "nav-plans") { goSite("plans", { hash: "abonnements" }); return; }
    if (act === "nav-home") { goSite("start", { hash: "" }); return; }
    if (act === "nav-blog") { goSite("blog", { slug: null, hash: "blog" }); return; }
    if (act === "nav-blog-post") { goSite("blog", { slug: id, hash: "blog/" + id }); return; }
    if (act === "nav-aide") { goSite("aide", { hash: "aide" }); return; }
    if (act === "nav-legal") { goSite("legal", { id: id || "mentions", hash: id || "mentions" }); return; }
    if (act === "site-nav-toggle") { siteNavOpen = !siteNavOpen; accountMenu = false; render(); return; }
    if (act === "parent-back-game") {
      siteNavOpen = false;
      if (profile()) go("home");
      else go("profiles");
      return;
    }
    if (act === "subscribe-soon") {
      plansMsg = "Bientôt disponible : les abonnements ouvriront très prochainement.";
      render();
      return;
    }
    if (act === "open-admin") {
      accountMenu = false;
      adminMsg = "";
      overlay = { type: "admin" };
      render();
      loadAdminCustomers().then(function () { if (overlay && overlay.type === "admin") render(); });
      return;
    }
    if (act === "admin-gift") {
      const el = document.getElementById("admin-gift-email");
      const email = ((el && el.value) || adminGiftEmail || "").trim();
      adminGiftEmail = email;
      if (!email) { adminMsg = "Entre un e-mail."; adminMsgKind = "err"; render(); return; }
      setAdminPlan(email, "lifetime_free");
      return;
    }
    if (act === "profiles") { go("profiles"); return; }
    if (act === "home") { go("home"); return; }
    if (act === "themes") { go("themes"); return; }
    if (act === "modes") { overlay = null; go("modes"); return; }
    if (act === "progress") { go("progress"); return; }
    if (act === "settings") { barMore = false; overlay = { type: "settings" }; render(); return; }
    if (act === "open-auth") { accountMenu = false; overlay = { type: "auth" }; render(); return; }
    if (act === "account-menu") { accountMenu = !accountMenu; barMore = false; render(); return; }
    if (act === "bar-more") { barMore = !barMore; accountMenu = false; render(); return; }
    if (act === "parent-gate") { overlay = null; askParent(function () { go("parent"); }); return; }
    if (act === "close-overlay") { overlay = null; parentAfter = null; render(); return; }
    if (act === "parent-ans") {
      if (overlay && Number(id) === overlay.ans) { sfx("ok"); parentOk(); }
      else { sfx("no"); if (el) el.classList.add("wrong"); }
      return;
    }
    if (act === "confirm-ok") {
      const fn = overlay && overlay.onok; overlay = null;
      if (fn) fn(); else render();
      return;
    }
    if (act === "pick-profile") {
      const p = store.profiles.find(function (x) { return x.id === id; });
      if (p) enterProfile(p);
      return;
    }
    if (act === "new-profile") {
      createDraft = { avatar: shuffle(AVATARS)[0], name: "", age: 5 };
      go("create"); return;
    }
    if (act === "draft-avatar") { createDraft.avatar = id; render(); return; }
    if (act === "draft-age") { createDraft.age = Number(id); render(); return; }
    if (act === "save-profile") {
      const inp = document.getElementById("child-name");
      if (inp) createDraft.name = inp.value.trim();
      const p = {
        id: newProfileId(),
        name: (createDraft.name || "").slice(0, 16),
        avatar: createDraft.avatar || "🦊",
        age: createDraft.age || 5,
        level: 1,
        stars: {}, words: {},
        starsAtCurrentLevel: 0, levelUpReady: false,
        updatedAt: new Date().toISOString(), dirty: true
      };
      if (isLoggedIn() && String(p.id).indexOf("-") === 8) { p.cloudId = p.id; p.cloudParentId = session.user.id; }
      store.profiles.push(p);
      profileId = p.id; store.lastProfileId = p.id;
      saveStore(); burst(50); sfx("ok"); speak("Hello!", "en-US");
      go("home"); return;
    }
    if (act === "set-age") {
      const pid = (overlay && overlay.profileId) || profileId;
      const p = store.profiles.find(function (x) { return x.id === pid; });
      if (p) { p.age = Number(id); touchProfile(p); saveStore(); }
      overlay = null; render(); return;
    }
    if (act === "edit-age") {
      const p = store.profiles.find(function (x) { return x.id === id; });
      if (!p) return;
      overlay = { type: "pick-age", profileId: id, age: p.age || 5 };
      render(); return;
    }
    if (act === "category") { categoryId = id; go("themes"); return; }
    if (act === "theme") {
      themeId = id;
      skipAnnounce = true;
      preloadThemeAudio(currentTheme());
      speak(currentTheme().en + "!", "en-US");
      go("modes"); return;
    }
    if (act === "discover") {
      discoverIndex = 0; go("discover");
      setTimeout(afterDiscoverShown, 280); return;
    }
    if (act === "prev") { discoverIndex--; go("discover"); setTimeout(afterDiscoverShown, 180); return; }
    if (act === "next") { discoverIndex++; go("discover"); setTimeout(afterDiscoverShown, 180); return; }
    if (act === "say-word") {
      const it = poolFor(currentTheme())[discoverIndex];
      if (it) {
        const line = discoverLine(it);
        speak(it.en, "en-US").then(function () { if (line) return speak(line, "en-US"); });
      }
      return;
    }
    if (act === "quiz") { overlay = null; startQuiz(); return; }
    if (act === "replay") { playQuestion(); return; }
    if (act === "memory-listen") {
      announceScreen("memory");
      return;
    }
    if (act === "answer") {
      if (!quiz || quiz.locked) return;
      const q = quiz.q;
      if (id === q.targetId) {
        quiz.locked = true;
        const c = q.choices.find(function (x) { return x.id === id; });
        if (c) c._state = "correct";
        quiz.got += 1;
        addStars(themeId, 1);
        markCorrect(q.wordIds);
        burst(70); sfx("ok"); render();
        const praise = PRAISE[Math.floor(Math.random() * PRAISE.length)];
        speak(praise, "en-US").then(function () {
          quiz.index += 1;
          if (quiz.index >= quiz.total) { celebrateRound(); return; }
          quiz.q = nextQuestion(); quiz.locked = false; render();
          setTimeout(playQuestion, 280);
        });
      } else {
        const c = q.choices.find(function (x) { return x.id === id; });
        if (c && c._state !== "wrong") {
          c._state = "wrong"; sfx("no"); render(); speak("Try again!", "en-US");
        }
      }
      return;
    }
    if (act === "memory") { startMemory(); return; }
    if (act === "flip") {
      if (!memory || memory.locked) return;
      const card = memory.cards[Number(id)];
      if (!card || card.flipped || card.matched) return;
      if (memory.open.length >= 2) return;
      card.flipped = true; memory.open.push(card); sfx("flip"); render();
      if (memory.open.length === 2) {
        memory.locked = true;
        const a = memory.open[0], b = memory.open[1];
        if (a.id === b.id) {
          a.matched = b.matched = true;
          memory.matched += 1; memory.open = []; memory.locked = false;
          addStars(themeId, 1); markCorrect([a.id]); burst(40); sfx("ok");
          speak(a.item.en, "en-US").then(function () {
            render();
            if (memory.matched >= memory.pairs) {
              burst(100); sfx("fanfare"); speak("You did it!", "en-US");
              overlay = {
                type: "celebrate", titou: "happy", title: "Bravo !", text: "⭐ " + memory.pairs,
                actions: '<button class="pill no" data-act="modes">Accueil</button><button class="pill ok" data-act="memory">Rejouer</button>'
              };
              render();
            }
          });
        } else {
          sfx("no");
          memoryMiss = true; render();
          setTimeout(function () {
            memoryMiss = false;
            a.flipped = b.flipped = false; memory.open = []; memory.locked = false; render();
          }, 750);
        }
      }
      return;
    }
    if (act === "toggle-fr") { store.frenchPrompts = !store.frenchPrompts; saveStore({ sync: false }); render(); return; }
    if (act === "toggle-dark") { setAppearance(effectiveDark() ? "light" : "dark"); return; }
    if (act === "appear-auto") { setAppearance("system"); return; }
    if (act === "auth-signup") { doSignUp(); return; }
    if (act === "auth-signin") { doSignIn(); return; }
    if (act === "auth-signout") { doSignOut(); return; }
    if (act === "auth-sync") {
      if (isLoggedIn()) { authMsg = "Synchronisation…"; authMsgKind = ""; accountMenu = false; render(); syncNow(); }
      return;
    }
    if (act === "delete-profile") {
      const p = store.profiles.find(function (x) { return x.id === id; });
      if (!p) return;
      const doDel = function () {
        overlay = {
          type: "confirm", warn: true, emoji: p.avatar, title: "Supprimer ?",
          text: (p.name || "Ce profil") + " et toutes les étoiles seront effacés.",
          onok: function () {
            const cloudId = p.cloudId || (String(p.id).length === 36 ? p.id : null);
            store.profiles = store.profiles.filter(function (x) { return x.id !== id; });
            if (profileId === id) profileId = store.profiles[0] ? store.profiles[0].id : null;
            store.lastProfileId = profileId;
            saveStore({ sync: false });
            if (cloudId) deleteRemoteProfile(cloudId).catch(function () {});
            go("parent");
          }
        };
        render();
      };
      askParent(doDel);
      return;
    }
    if (act === "reset-progress") {
      const p = store.profiles.find(function (x) { return x.id === id; });
      if (!p) return;
      const doReset = function () {
        overlay = {
          type: "confirm", warn: true, emoji: "↺", title: "Réinitialiser ?",
          text: "Les étoiles et les mots appris de ce profil seront remis à zéro.",
          onok: function () {
            p.stars = {}; p.words = {}; p.starsAtCurrentLevel = 0; p.levelUpReady = false;
            touchProfile(p); saveStore(); go("parent");
          }
        };
        render();
      };
      askParent(doReset);
      return;
    }
    if (act === "levelup-ask") {
      const p = profile();
      if (!p || p.level >= 3) return;
      p.level += 1; p.starsAtCurrentLevel = 0; p.levelUpReady = false;
      touchProfile(p); saveStore();
      burst(120); sfx("fanfare"); speak("Well done!", "en-US");
      overlay = {
        type: "celebrate", titou: "medal", title: "Bravo !",
        text: "Les jeux seront un petit peu plus difficiles, adaptés à tes progrès.",
        actions: '<button class="pill ok" data-act="close-overlay">OK</button>'
      };
      render(); return;
    }
  }

  $app.addEventListener("click", function (e) {
    const btn = e.target.closest("[data-act]");
    if (!btn || !$app.contains(btn)) return;
    if (btn.classList.contains("overlay") && e.target !== btn) return;
    e.preventDefault();
    onAct(btn.getAttribute("data-act"), btn.getAttribute("data-id"), btn);
  });

  function seedDemo(level, age) {
    if (!store.profiles.length) {
      store.profiles.push({
        id: "demo", name: "Léo", avatar: "🦊",
        level: level || 1, age: age || 6,
        stars: { pets: 2, colours: 1 },
        words: { dog: { correct: 3 }, cat: { correct: 1 } },
        starsAtCurrentLevel: 3, levelUpReady: false
      });
      saveStore({ sync: false });
    } else {
      if (level) store.profiles[0].level = level;
      if (age) store.profiles[0].age = age;
    }
    profileId = store.profiles[0].id;
    themeId = "pets";
    categoryId = "animaux";
  }

  window.__englishStars = {
    go: go,
    startQuiz: startQuiz,
    seedDemo: seedDemo,
    unlockAudio: unlockAudio,
    setAppearance: setAppearance,
    themeCount: function () { return THEME_ORDER.length; },
    getState: function () {
      return {
        screen: screen, store: store, profileId: profileId, themeId: themeId, categoryId: categoryId,
        quiz: quiz, loggedIn: isLoggedIn(), syncState: syncState, hasSupabase: !!sb,
        themeCount: THEME_ORDER.length, dark: effectiveDark(), overlay: overlay && overlay.type,
        plan: currentPlan(), isAdmin: isAdmin()
      };
    },
    showStart: function () { screen = "start"; overlay = null; render(); },
    showHome: function () { seedDemo(1, 6); go("home"); },
    showThemes: function () { seedDemo(1, 6); categoryId = "animaux"; go("themes"); },
    showQuiz: function (level, age) { seedDemo(level || 1, age || 6); startQuiz(); },
    openTheme: function (id, age, level) { seedDemo(level || 1, age || 6); themeId = id; categoryId = THEMES[id].cat; go("modes"); },
    openDiscover: function (id, age) { seedDemo(1, age || 6); themeId = id; categoryId = THEMES[id].cat; discoverIndex = 0; go("discover"); setTimeout(afterDiscoverShown, 200); },
    poolFor: function (id) { return poolFor(THEMES[id]).map(function (it) { return it.id; }); },
    difficulty: function () { return difficultyOf(profile()); },
    showAge: function () {
      seedDemo(1, 6);
      createDraft = { avatar: "🦊", name: "Léo", age: 6 };
      go("create");
    },
    showAuth: function () { seedDemo(1, 6); overlay = { type: "auth" }; render(); },
    showSettings: function () { seedDemo(1, 6); overlay = { type: "settings" }; render(); },
    showParentLock: function () { seedDemo(1, 6); askParent(function () { go("parent"); }); },
    showMemory: function (level, age) { seedDemo(level || 1, age || 6); startMemory(); },
    audioUrl: audioUrl,
    audioSlug: audioSlug,
    speak: speak,
    showAccountMenu: function (opts) {
      const prev = session;
      const prevAcc = parentAccount;
      if (!isLoggedIn()) session = { user: { email: "parent@example.com" } };
      if (opts && opts.admin) parentAccount = { plan: "lifetime_free", is_admin: true, email: (session.user && session.user.email) || "" };
      else if (!parentAccount) parentAccount = { plan: "free", is_admin: false };
      accountMenu = true;
      render();
      session = prev;
      if (opts && opts.admin && !prevAcc) parentAccount = prevAcc;
    },
    showPlans: function () { plansMsg = ""; overlay = { type: "plans" }; accountMenu = false; render(); },
    showPlansPage: function () { plansMsg = ""; goSite("plans", { hash: "abonnements" }); },
    showBlog: function (slug) { goSite("blog", { slug: slug || null, hash: slug ? "blog/" + slug : "blog" }); },
    showLegal: function (id) { goSite("legal", { id: id || "cgv", hash: id || "cgv" }); },
    showAide: function () { goSite("aide", { hash: "aide" }); },
    showAdmin: function () {
      if (!parentAccount) parentAccount = { plan: "lifetime_free", is_admin: true, email: "bringard.aurelien@gmail.com" };
      parentAccount.is_admin = true;
      overlay = { type: "admin" }; accountMenu = false; render();
      if (isLoggedIn() && sb) loadAdminCustomers().then(function () { if (overlay && overlay.type === "admin") render(); });
    }
  };
  window.__helloTitou = window.__englishStars;

  function boot() {
    const raw = (location.hash || "").replace("#", "");
    try {
      prefetchUrl(audioUrl("Hello!", "en-US"));
      prefetchUrl(audioUrl("Hi! I'm Titou! Let's play!", "en-US"));
    } catch (e) { /* ignore */ }
    initCloud();
    window.addEventListener("hashchange", function () {
      const r = (location.hash || "").replace("#", "");
      if (r && r.charAt(0) !== "/" && /^(quiz|home|themes|age|auth|progress)$/.test(r)) return;
      if (!applyHashRoute()) {
        if (!r || r === "/") goSite("start", { hash: false });
      }
    });
    if (raw === "quiz") { seedDemo(1, 5); startQuiz(); return; }
    if (raw === "home") { seedDemo(1, 6); go("home"); return; }
    if (raw === "themes") { seedDemo(1, 6); categoryId = "animaux"; go("themes"); return; }
    if (raw === "age") { window.__englishStars.showAge(); return; }
    if (raw === "auth") { seedDemo(1, 6); go("home"); overlay = { type: "auth" }; render(); return; }
    if (raw === "progress") { seedDemo(1, 6); go("progress"); return; }
    if (applyHashRoute()) return;
    go("start");
  }
  boot();
})();

  </script>
</body>
</html>
